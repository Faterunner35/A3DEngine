name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC 2022
            os: windows-latest
          - name: Linux GCC
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # ошибки и предупреждения компилятора — в аннотации (видны в PR и через API)
          grep -E "error|warning C[0-9]+" build.log | sort -u | head -50 | while IFS= read -r line; do
            echo "::warning::${line}"
          done
          exit $status

      - name: Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stress (hierarchy)
        shell: bash
        run: |
          if [ -f build/Release/engine_tests.exe ]; then
            build/Release/engine_tests.exe --stress
          else
            build/engine_tests --stress
          fi
